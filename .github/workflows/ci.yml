name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bindings]"

      - name: Lint
        run: |
          pip install ruff
          ruff check src tests scripts

      # The whole point of verify.py: one command proves the project works,
      # and optional components that are absent degrade to SKIP.
      - name: Verify
        run: python scripts/verify.py

  benchmark:
    name: performance regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Benchmark with regression tracking
        run: python -m infer_lab.cli bench --track --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-history
          path: artifacts/bench_history.jsonl
